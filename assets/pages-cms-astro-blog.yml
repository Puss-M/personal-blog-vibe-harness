media:
  input: public/media
  output: /media

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: pubDate
        label: Publish date
        type: date
      - name: updatedDate
        label: Updated date
        type: date
      - name: heroImage
        label: Cover image
        type: image
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
      - name: body
        label: Body
        type: rich-text

  - name: site
    label: Site settings
    type: file
    path: src/content/site.yml
    fields:
      - name: title
        label: Site title
        type: string
      - name: description
        label: Site description
        type: text
      - name: author
        label: Author
        type: string
      - name: url
        label: Site URL
        type: string
